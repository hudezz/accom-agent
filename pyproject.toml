[project]
name = "accom-agent"
version = "0.1.0"
description = "AI agent that finds student accommodation near Malaysian universities"
readme = "README.md"
authors = [
    { name = "hudezz", email = "hudhaifaabdikadir090@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "geopy>=2.5.0",
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
]

[project.scripts]
accom-agent = "accom_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
